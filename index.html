<!DOCTYPE html>
<html>
<head>
  <title>Do you like me, Adi?</title>
  <style>
    body {
      text-align: center;
      font-family: Arial;
      margin-top: 100px;
      background: #ffe6f0;
    }

    h1 {
      font-size: 35px;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      margin: 10px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }

    #yes {
      background: #ff4da6;
      color: white;
    }

    #no {
      position: absolute;
      background: gray;
      color: white;
    }

    #panda {
      display: none;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<h1>Do you like me, Adi? 🥺</h1>

<button id="yes" onclick="yesClick()">Yes 💖</button>
<button id="no" onmouseover="moveNo()">No 😢</button>

<div id="panda">
  <h2>Adi said YES! 😍 Ummah Ummah 😘🐼</h2>
  <img src="https://media.tenor.com/7YQC7xzuzcAAAAAC/panda-kiss.gif" width="200">
</div>

<script>
function moveNo() {
  let btn = document.getElementById("no");
  btn.style.top = Math.random()*400 + "px";
  btn.style.left = Math.random()*400 + "px";

  let yes = document.getElementById("yes");
  let size = parseInt(window.getComputedStyle(yes).fontSize);
  yes.style.fontSize = (size + 5) + "px";
}

function yesClick() {
  document.getElementById("panda").style.display = "block";
}
</script>

</body>
</html>
